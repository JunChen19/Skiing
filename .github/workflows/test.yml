name: Game tests
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node test/smoke.js
      - run: node --test test/steering.js test/rocks.js test/jump.js test/leaderboard.js
      - run: node build.js
      - run: git diff --exit-code -- index.html
